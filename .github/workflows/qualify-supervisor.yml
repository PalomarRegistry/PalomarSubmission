name: Qualify cgroup supervisor

# Phase 1a of the Namespace + `lake comparator` migration. Throwaway: runs the real resource
# boundary tests under the inactive cgroup supervisor (PALOMAR_SUPERVISOR=cgroup) on both
# runner types, with bubblewrap 0.12.0 built from the pinned tag, while production still
# uses the systemd unit. Folded into ci.yml when the supervisor is activated.

on:
  workflow_dispatch:
  push:
    branches: [supervisor-cgroup]

permissions:
  contents: read

jobs:
  real-boundary:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: github-hosted
            runner: ubuntu-24.04
          - label: namespace-privileged
            runner: ["nscloud-ubuntu-24.04-amd64-16x32-with-features", "namespace-features:container.privileged=true"]
    name: real boundary (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.10"
      - name: Install trusted dependencies
        run: python -m pip install --require-hashes --no-deps -r requirements.txt
      - name: Build bubblewrap 0.12.0 from the pinned tarball
        run: |
          set -euo pipefail
          sudo apt-get update -qq >/dev/null; sudo apt-get install -y -qq meson ninja-build libcap-dev pkg-config >/dev/null
          curl -sSL --fail https://github.com/containers/bubblewrap/releases/download/v0.12.0/bubblewrap-0.12.0.tar.xz -o "$RUNNER_TEMP/bwrap.tar.xz"
          echo "9760d007363e3abba7c747489910f9f82d9fca53ba3bd3282e396fa3c97a3314  $RUNNER_TEMP/bwrap.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/bwrap.tar.xz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/bubblewrap-0.12.0" && meson setup build -Dselinux=disabled -Dman=disabled -Dbash_completion=disabled -Dzsh_completion=disabled -Dtests=false >/dev/null && ninja -C build >/dev/null
          mkdir -p "$RUNNER_TEMP/bwrap-bin" && install -m 0755 build/bwrap "$RUNNER_TEMP/bwrap-bin/bwrap"
          echo "PALOMAR_BWRAP=$RUNNER_TEMP/bwrap-bin/bwrap" >> "$GITHUB_ENV"
          # Ubuntu 24.04 restricts unprivileged user namespaces to AppArmor-profiled binaries.
          if [ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)" = 1 ]; then
            printf '%s\n' 'abi <abi/4.0>,' 'include <tunables/global>' "profile bwrap-qualify $RUNNER_TEMP/bwrap-bin/bwrap flags=(unconfined) {" '  userns,' '}' | sudo tee /etc/apparmor.d/bwrap-qualify >/dev/null
            sudo apparmor_parser -r /etc/apparmor.d/bwrap-qualify
          fi
      - name: Record the runner's delegation shape
        run: |
          echo "pid1=$(cat /proc/1/comm) cgroup=$(cat /proc/self/cgroup) mount=$(findmnt -no OPTIONS /sys/fs/cgroup)"
          cat /sys/fs/cgroup/cgroup.controllers
      - name: Unit tests for the supervisor functions
        run: python -m unittest -v tests.test_resource_supervision
      - name: Real resource boundary tests under the cgroup supervisor
        env:
          PALOMAR_SUPERVISOR: cgroup
        run: python -m unittest -v tests.test_resource_supervision.RealResourceBoundaryTests
      - name: Babysitter status and delegation report on failure
        if: failure()
        run: |
          ls -la /sys/fs/cgroup/palomar 2>/dev/null || true
          find /sys/fs/cgroup -maxdepth 4 -name 'palomar-*' 2>/dev/null || true
