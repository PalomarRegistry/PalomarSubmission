name: Qualify cgroup supervisor

# Phase 1 of the Namespace + `lake comparator` migration. Throwaway: runs the real resource
# and confinement boundary tests under the cgroup supervisor and the bubblewrap policy on
# both runner types, with bubblewrap 0.12.0 built from the pinned tag. Folded into ci.yml
# once Namespace is the production runner.

on:
  workflow_dispatch:
  push:
    branches: [supervisor-cgroup, supervisor-activate]

permissions:
  contents: read

jobs:
  real-boundary:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: github-hosted
            runner: ubuntu-24.04
          - label: namespace-privileged
            runner: ["nscloud-ubuntu-24.04-amd64-16x32-with-features", "namespace-features:container.privileged=true"]
    name: real boundary (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.10"
      - name: Install trusted dependencies
        run: python -m pip install --require-hashes --no-deps -r requirements.txt
      - name: Build bubblewrap 0.12.0 from the pinned tarball
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq meson ninja-build libcap-dev pkg-config >/dev/null
          echo "PALOMAR_BWRAP=$(scripts/install_bwrap.sh "$RUNNER_TEMP/bwrap-bin")" >> "$GITHUB_ENV"
      - name: Record the runner's delegation shape
        run: |
          echo "pid1=$(cat /proc/1/comm) cgroup=$(cat /proc/self/cgroup) mount=$(findmnt -no OPTIONS /sys/fs/cgroup)"
          cat /sys/fs/cgroup/cgroup.controllers
      - name: Unit tests for the supervisor functions
        run: python -m unittest -v tests.test_resource_supervision
      - name: Real resource and confinement boundary tests
        run: |
          python -m unittest -v \
            tests.test_resource_supervision.RealResourceBoundaryTests \
            tests.test_sandbox_integration.SandboxIntegrationTests.test_real_read_write_process_and_network_boundary \
            tests.test_sandbox_integration.SandboxIntegrationTests.test_real_renderer_policy_proves_the_same_controls
      - name: Babysitter status and delegation report on failure
        if: failure()
        run: |
          ls -la /sys/fs/cgroup/palomar 2>/dev/null || true
          find /sys/fs/cgroup -maxdepth 4 -name 'palomar-*' 2>/dev/null || true
