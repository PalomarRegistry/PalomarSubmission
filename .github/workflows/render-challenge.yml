name: Render accepted Challenge
# The run title carries only the request id. A caller's own run name
# replaces this one, but no caller may name the source repository either.
run-name: Render challenge [${{ inputs.request_id }}]

on:
  # Palomar's confidential runs repository calls this exact job at a pinned
  # commit, so its run, logs and artifact stay private to the caller.
  workflow_call:
    inputs:
      repository:
        description: Public GitHub repository in owner/name form
        required: true
        type: string
      commit:
        description: Accepted 40-character source commit
        required: true
        type: string
      pipeline_commit:
        description: Full PalomarSubmission commit used in this workflow's uses reference
        required: true
        type: string
      challenge_sha256:
        description: Accepted Challenge source SHA-256
        required: true
        type: string
      request_id:
        description: Unique lowercase hexadecimal publication request ID
        required: true
        type: string
      execution_profile:
        description: Approved execution profile inherited from verification (blank selects the catalogue default)
        required: false
        default: ""
        type: string
      project_path:
        description: Accepted repository-relative project directory (blank means root)
        # GitHub rejects an explicitly empty value for a required dispatch
        # input. Root projects are represented by the empty default, while
        # nested projects still supply their authenticated non-empty path.
        required: false
        default: ""
        type: string
      challenge_path:
        description: Accepted repository-relative Challenge source path
        required: true
        type: string
      solution_path:
        description: Accepted repository-relative Solution source path
        required: true
        type: string
      comparator_config_path:
        description: Accepted repository-relative Comparator configuration path
        required: true
        type: string
      lakefile_path:
        description: Accepted repository-relative Lakefile path
        required: true
        type: string
      lean_toolchain_path:
        description: Accepted repository-relative lean-toolchain path
        required: true
        type: string
      # Confidential renders only: source comes from the restored snapshot
      # bundles in this same-run artifact, never from the network.
      source_bundle_artifact:
        description: Same-run artifact of restored source bundles (confidential renders only)
        required: false
        default: ""
        type: string
      snapshot_sha256:
        description: SHA-256 of the finalized snapshot descriptor the bundles must match
        required: false
        default: ""
        type: string
  workflow_dispatch:
    inputs:
      repository:
        description: Public GitHub repository in owner/name form
        required: true
        type: string
      commit:
        description: Accepted 40-character source commit
        required: true
        type: string
      challenge_sha256:
        description: Accepted Challenge source SHA-256
        required: true
        type: string
      request_id:
        description: Unique lowercase hexadecimal publication request ID
        required: true
        type: string
      execution_profile:
        description: Approved execution profile inherited from verification (blank selects the catalogue default)
        required: false
        default: ""
        type: string
      project_path:
        description: Accepted repository-relative project directory (blank means root)
        # GitHub rejects an explicitly empty value for a required dispatch
        # input. Root projects are represented by the empty default, while
        # nested projects still supply their authenticated non-empty path.
        required: false
        default: ""
        type: string
      challenge_path:
        description: Accepted repository-relative Challenge source path
        required: true
        type: string
      solution_path:
        description: Accepted repository-relative Solution source path
        required: true
        type: string
      comparator_config_path:
        description: Accepted repository-relative Comparator configuration path
        required: true
        type: string
      lakefile_path:
        description: Accepted repository-relative Lakefile path
        required: true
        type: string
      lean_toolchain_path:
        description: Accepted repository-relative lean-toolchain path
        required: true
        type: string

permissions:
  contents: read

# Concurrency groups belong to the repository that runs the workflow, so a
# caller's renders never queue behind Palomar's own.
concurrency:
  group: palomar-render-${{ inputs.request_id }}
  cancel-in-progress: false

jobs:
  profile:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      labels: ${{ steps.resolve.outputs.labels }}
      render_timeout: ${{ steps.resolve.outputs.render_timeout }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: PalomarRegistry/PalomarSubmission
          ref: ${{ inputs.pipeline_commit || github.workflow_sha }}
          persist-credentials: false
      # Confidential (bundle) runs execute only on the confidential profile:
      # no caches, no debugging, Technical Maintainer access only.
      - name: Require the confidential profile for snapshot runs
        if: inputs.snapshot_sha256 != '' || inputs.source_bundle_artifact != ''
        env:
          PALOMAR_EXECUTION_PROFILE: ${{ inputs.execution_profile }}
        run: |
          if [ "$PALOMAR_EXECUTION_PROFILE" != "palomar-confidential-16x32-v1" ]; then
            echo "::error::confidential runs must use the palomar-confidential-16x32-v1 execution profile"
            exit 1
          fi
      - id: resolve
        env:
          PALOMAR_EXECUTION_PROFILE: ${{ inputs.execution_profile }}
        run: python3 scripts/verification_profile.py --resolve
  render:
    needs: profile
    runs-on: ${{ fromJSON(needs.profile.outputs.labels) }}
    env:
      PALOMAR_EXECUTION_PROFILE: ${{ inputs.execution_profile }}
    timeout-minutes: ${{ fromJSON(needs.profile.outputs.render_timeout) }}
    permissions:
      contents: read
    steps:
      - name: Validate request identifier
        env:
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          if [[ ! "$REQUEST_ID" =~ ^[0-9a-f]{32}$ ]]; then
            echo "request_id must be 32 lowercase hexadecimal characters" >&2
            exit 2
          fi

      - name: Validate pinned pipeline revision
        env:
          PIPELINE_COMMIT: ${{ inputs.pipeline_commit || github.workflow_sha }}
        run: |
          if [[ ! "$PIPELINE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "pipeline_commit must be a full lowercase commit SHA" >&2
            exit 1
          fi

      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Checkout trusted renderer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PalomarRegistry/PalomarSubmission
          ref: ${{ inputs.pipeline_commit || github.workflow_sha }}
          path: pipeline
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.18"

      - name: Install verifier dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes --no-deps -r pipeline/requirements.txt

      - name: Receive restored source bundles
        if: inputs.source_bundle_artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.source_bundle_artifact }}
          path: ${{ runner.temp }}/source-bundles

      - name: Fetch and bind accepted source
        id: prepare
        working-directory: pipeline
        env:
          SOURCE_BUNDLE_ARTIFACT: ${{ inputs.source_bundle_artifact }}
          SNAPSHOT_SHA256: ${{ inputs.snapshot_sha256 }}
          SOURCE_REPOSITORY: ${{ inputs.repository }}
          SOURCE_COMMIT: ${{ inputs.commit }}
          CHALLENGE_SHA256: ${{ inputs.challenge_sha256 }}
          PROJECT_PATH: ${{ inputs.project_path }}
          CHALLENGE_PATH: ${{ inputs.challenge_path }}
          SOLUTION_PATH: ${{ inputs.solution_path }}
          COMPARATOR_CONFIG_PATH: ${{ inputs.comparator_config_path }}
          LAKEFILE_PATH: ${{ inputs.lakefile_path }}
          LEAN_TOOLCHAIN_PATH: ${{ inputs.lean_toolchain_path }}
        run: |
          bundle_args=()
          if [ -n "$SOURCE_BUNDLE_ARTIFACT" ] || [ -n "$SNAPSHOT_SHA256" ]; then
            bundle_args=(--source-bundles "$RUNNER_TEMP/source-bundles" --snapshot-sha256 "$SNAPSHOT_SHA256")
          fi
          python -m scripts.render_challenge prepare "${bundle_args[@]}" \
            --repository "$SOURCE_REPOSITORY" \
            --commit "$SOURCE_COMMIT" \
            --challenge-sha256 "$CHALLENGE_SHA256" \
            --project-path "$PROJECT_PATH" \
            --challenge-path "$CHALLENGE_PATH" \
            --solution-path "$SOLUTION_PATH" \
            --comparator-config-path "$COMPARATOR_CONFIG_PATH" \
            --lakefile-path "$LAKEFILE_PATH" \
            --lean-toolchain-path "$LEAN_TOOLCHAIN_PATH" \
            --work-dir "$RUNNER_TEMP/palomar-render" \
            --output "$RUNNER_TEMP/palomar-render/report.json"

      - name: Install pinned elan
        if: steps.prepare.outputs.ready == 'true'
        run: |
          python3 pipeline/scripts/trusted_download.py \
            --url https://github.com/leanprover/elan/releases/download/v4.2.3/elan-x86_64-unknown-linux-gnu.tar.gz \
            --output "$RUNNER_TEMP/elan.tar.gz" \
            --sha256 df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2
          mkdir "$RUNNER_TEMP/elan"
          tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP/elan"
          "$RUNNER_TEMP/elan/elan-init" -y --no-modify-path --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install accepted Lean toolchain
        if: steps.prepare.outputs.ready == 'true'
        env:
          LEAN_TOOLCHAIN: ${{ steps.prepare.outputs.lean_toolchain }}
        run: elan toolchain install "$LEAN_TOOLCHAIN"

      - name: Build pinned bubblewrap
        if: steps.prepare.outputs.ready == 'true'
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq meson ninja-build libcap-dev pkg-config >/dev/null
          echo "PALOMAR_BWRAP=$(pipeline/scripts/install_bwrap.sh "$RUNNER_TEMP/bwrap-bin")" >> "$GITHUB_ENV"

      - name: Build, sanitize, and hash Challenge rendering under bubblewrap
        if: steps.prepare.outputs.ready == 'true'
        working-directory: pipeline
        env:
          RENDERER_COMMIT: ${{ inputs.pipeline_commit || github.workflow_sha }}
          RUN_REPOSITORY: ${{ github.repository }}
          SOURCE_BUNDLE_ARTIFACT: ${{ inputs.source_bundle_artifact }}
          SNAPSHOT_SHA256: ${{ inputs.snapshot_sha256 }}
        run: |
          bundle_args=()
          if [ -n "$SOURCE_BUNDLE_ARTIFACT" ] || [ -n "$SNAPSHOT_SHA256" ]; then
            bundle_args=(--source-bundles "$RUNNER_TEMP/source-bundles" --snapshot-sha256 "$SNAPSHOT_SHA256")
          fi
          python -m scripts.render_challenge execute "${bundle_args[@]}" \
            --work-dir "$RUNNER_TEMP/palomar-render" \
            --output "$RUNNER_TEMP/palomar-render/report.json" \
            --bwrap "$PALOMAR_BWRAP" \
            --renderer-commit "$RENDERER_COMMIT" \
            --bwrap-source-tag v0.12.0 \
            --run-repository "$RUN_REPOSITORY" \
            --workflow-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Upload bounded render result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: challenge-render-${{ inputs.request_id }}
          path: |
            ${{ runner.temp }}/palomar-render/report.json
            ${{ runner.temp }}/palomar-render/result
          if-no-files-found: error
          retention-days: ${{ inputs.snapshot_sha256 != '' && 1 || 30 }}

      - name: Require a successful render
        if: always()
        run: |
          python -c 'import json, os, pathlib, sys; p = pathlib.Path(os.environ["RUNNER_TEMP"]) / "palomar-render" / "report.json"; sys.exit(0 if json.loads(p.read_text())["status"] == "pass" else 1)'
