name: Verify submission
run-name: "Verify submission ${{ inputs.request_id }}"

# Submissions arrive through the submission server, which dispatches this
# workflow. The run name carries the submission id because dispatching does
# not return a run id, and the server has to find the run it started.
on:
  workflow_dispatch:
    inputs:
      repository:
        description: Public GitHub repository in owner/name form
        required: true
        type: string
      commit:
        description: Full 40-character commit to verify
        required: true
        type: string
      request_id:
        description: Opaque submission id from the submission server
        required: true
        type: string
      options:
        description: JSON object of optional submission fields
        required: false
        type: string

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read
    # Verification runs for up to six hours, and anyone able to prove push
    # access to a public repository can cause one, so runs are serialised
    # rather than allowed to exhaust the organisation's runners.
    concurrency:
      group: palomar-verify
      cancel-in-progress: false
    steps:
      - name: Record verification deadline origin
        run: echo "PALOMAR_JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Checkout submission pipeline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pipeline
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.10"

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.3.12"
          bundler-cache: true
          working-directory: pipeline

      - name: Install verifier dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes --no-deps -r pipeline/requirements.txt

      - name: Parse and fetch immutable source
        id: prepare
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/pipeline/Gemfile
        run: |
          python pipeline/scripts/verify_submission.py prepare \
            --event "$GITHUB_EVENT_PATH" \
            --work-dir "$RUNNER_TEMP/palomar" \
            --output "$RUNNER_TEMP/mechanical-report.json" \
            --licensee "$(command -v bundle)"

      - name: Install pinned elan
        if: steps.prepare.outputs.ready == 'true'
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$RUNNER_TEMP/elan.tar.gz" \
            https://github.com/leanprover/elan/releases/download/v4.2.3/elan-x86_64-unknown-linux-gnu.tar.gz
          echo "df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2  $RUNNER_TEMP/elan.tar.gz" \
            | sha256sum --check
          mkdir "$RUNNER_TEMP/elan"
          tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP/elan"
          "$RUNNER_TEMP/elan/elan-init" -y --no-modify-path --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.prepare.outputs.ready == 'true'
        with:
          go-version: "1.24.0"

      - name: Build pinned landrun
        if: steps.prepare.outputs.ready == 'true'
        run: |
          CGO_ENABLED=0 go install github.com/zouuup/landrun/cmd/landrun@811cfff51ceaf3d9843708aa6d22e9b84ccac8b4
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build pinned Comparator
        if: steps.prepare.outputs.ready == 'true'
        run: |
          git clone --filter=blob:none https://github.com/leanprover/comparator.git "$RUNNER_TEMP/comparator"
          git -C "$RUNNER_TEMP/comparator" checkout 68a064109f01c08f47c8edc9f51d6a2bbffaa188
          cd "$RUNNER_TEMP/comparator"
          lake build comparator

      - name: Build pinned NanoDa kernel
        if: steps.prepare.outputs.ready == 'true'
        run: |
          git clone --filter=blob:none https://github.com/robsimmons/nanoda_lib.git "$RUNNER_TEMP/nanoda"
          git -C "$RUNNER_TEMP/nanoda" checkout 68d5ca9db226849b41a6fff59d796ff19d0a8840
          cargo build --release --locked --manifest-path "$RUNNER_TEMP/nanoda/Cargo.toml"

      - name: Build toolchain-matched lean4export
        if: steps.prepare.outputs.ready == 'true'
        env:
          LEAN4EXPORT_COMMIT: ${{ steps.prepare.outputs.lean4export_commit }}
          SUBMISSION_TOOLCHAIN: ${{ steps.prepare.outputs.lean_toolchain }}
        run: |
          git clone --filter=blob:none https://github.com/leanprover/lean4export.git "$RUNNER_TEMP/lean4export"
          git -C "$RUNNER_TEMP/lean4export" checkout "$LEAN4EXPORT_COMMIT"
          test "$(tr -d '\r\n' < "$RUNNER_TEMP/lean4export/lean-toolchain")" = "$SUBMISSION_TOOLCHAIN"
          cd "$RUNNER_TEMP/lean4export"
          lake build lean4export

      - name: Run Comparator and challenge provenance audit
        if: steps.prepare.outputs.ready == 'true'
        run: |
          python pipeline/scripts/verify_submission.py execute \
            --work-dir "$RUNNER_TEMP/palomar" \
            --output "$RUNNER_TEMP/mechanical-report.json" \
            --comparator "$RUNNER_TEMP/comparator/.lake/build/bin/comparator" \
            --lean4export "$RUNNER_TEMP/lean4export/.lake/build/bin/lean4export" \
            --landrun "$(go env GOPATH)/bin/landrun" \
            --nanoda "$RUNNER_TEMP/nanoda/target/release/nanoda_bin" \
            --comparator-commit 68a064109f01c08f47c8edc9f51d6a2bbffaa188 \
            --landrun-commit 811cfff51ceaf3d9843708aa6d22e9b84ccac8b4 \
            --nanoda-commit 68d5ca9db226849b41a6fff59d796ff19d0a8840 \
            --execution-budget-seconds 19800 \
            --workflow-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Upload bounded mechanical report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mechanical-report-${{ inputs.request_id }}
          path: ${{ runner.temp }}/mechanical-report.json
          if-no-files-found: error
          retention-days: 90

