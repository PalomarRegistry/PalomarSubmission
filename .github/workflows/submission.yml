name: Verify submission
run-name: >-
  ${{ inputs.mode == 'preflight'
      && format('Preflight submission {0}', inputs.request_id)
      || inputs.mode == 'correction'
      && format('Validate registry correction {0}', inputs.request_id)
      || format('Verify submission {0}', inputs.request_id) }}${{ inputs.execution_attempt && format(' [{0}]', inputs.execution_attempt) || '' }}

# Submissions arrive through the submission server, which dispatches this
# workflow. The run name carries the submission id because dispatching does
# not return a run id, and the server has to find the run it started.
on:
  # A repository may call the exact same full job as a mechanical preflight.
  # It has no Palomar state or credentials and is predictive only; the server
  # remains the authority that dispatches registry verification.
  workflow_call:
    inputs:
      repository:
        description: Public GitHub repository in owner/name form
        required: true
        type: string
      commit:
        description: Full 40-character commit to verify
        required: true
        type: string
      pipeline_commit:
        description: Full PalomarSubmission commit used in this workflow's uses reference
        required: true
        type: string
      request_id:
        description: Caller-chosen lowercase identifier for the preflight artifact
        required: true
        type: string
      mode:
        description: Use full for a complete mechanical preflight
        required: false
        default: full
        type: string
      execution_profile:
        description: Approved operator-selected execution profile
        required: false
        default: palomar-standard-v1
        type: string
      execution_attempt:
        description: Audited operator attempt identifier
        required: false
        type: string
      options:
        description: JSON object of optional submission fields
        required: false
        default: "{}"
        type: string
  workflow_dispatch:
    inputs:
      repository:
        description: Public GitHub repository in owner/name form
        required: true
        type: string
      commit:
        description: Full 40-character commit to verify
        required: true
      request_id:
        description: Opaque submission id from the submission server
        required: true
        type: string
      mode:
        description: Run shared preparation only, or the complete verifier
        required: false
        default: full
        type: choice
        options:
          - preflight
          - full
          - correction
      execution_profile:
        description: Approved operator-selected execution profile
        required: false
        default: palomar-standard-v1
        type: string
      execution_attempt:
        description: Audited operator attempt identifier
        required: false
        type: string
      options:
        description: JSON object of optional submission fields
        required: false
        type: string

jobs:
  profile:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      labels: ${{ steps.resolve.outputs.labels }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: PalomarRegistry/PalomarSubmission
          ref: ${{ inputs.pipeline_commit || github.workflow_sha }}
          persist-credentials: false
      - name: Resolve approved execution profile
        id: resolve
        env:
          PALOMAR_EXECUTION_PROFILE: ${{ inputs.execution_profile }}
          PALOMAR_NAMESPACE_ENABLED: ${{ vars.PALOMAR_NAMESPACE_ENABLED }}
        run: python3 scripts/verification_profile.py --resolve
  verify:
    needs: profile
    runs-on: ${{ fromJSON(needs.profile.outputs.labels) }}
    env:
      PALOMAR_EXECUTION_PROFILE: ${{ inputs.execution_profile }}
      PALOMAR_NAMESPACE_ENABLED: ${{ vars.PALOMAR_NAMESPACE_ENABLED }}
    timeout-minutes: 350
    permissions:
      contents: read
    # Dispatches queue per admitted request; admission concurrency belongs to
    # the submission server. Reusable callers choose their own request ids,
    # so scope their groups to the caller run and attempt as well. Independent
    # CI runs must not cancel each other while pending behind a slow job.
    concurrency:
      group: palomar-verify-${{ inputs.pipeline_commit && format('call-{0}-{1}-', github.run_id, github.run_attempt) || '' }}${{ inputs.mode }}-${{ inputs.request_id }}
      cancel-in-progress: false
    steps:
      - name: Record verification deadline origin
        run: echo "PALOMAR_JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Validate pinned pipeline revision
        env:
          PIPELINE_COMMIT: ${{ inputs.pipeline_commit || github.workflow_sha }}
        run: |
          if [[ ! "$PIPELINE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "pipeline_commit must be a full lowercase commit SHA" >&2
            exit 1
          fi

      - name: Checkout submission pipeline
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PalomarRegistry/PalomarSubmission
          ref: ${{ inputs.pipeline_commit || github.workflow_sha }}
          path: pipeline
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: python
        with:
          python-version: "3.11.10"

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        id: ruby
        with:
          ruby-version: "3.3.12"
          bundler-cache: true
          working-directory: pipeline

      - name: Install verifier dependencies
        id: dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes --no-deps -r pipeline/requirements.txt

      - name: Parse and fetch immutable source
        id: prepare
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/pipeline/Gemfile
          PALOMAR_INPUTS: ${{ toJSON(inputs) }}
        run: |
          python - <<'PYTHON'
          import json, os, pathlib
          path = pathlib.Path(os.environ["RUNNER_TEMP"], "submission-inputs.json")
          path.write_text(json.dumps({"inputs": json.loads(os.environ["PALOMAR_INPUTS"])}))
          PYTHON
          python pipeline/scripts/verify_submission.py prepare \
            --event "$RUNNER_TEMP/submission-inputs.json" \
            --work-dir "$RUNNER_TEMP/palomar" \
            --output "$RUNNER_TEMP/mechanical-report.json" \
            --licensee "$(command -v bundle)"

      - name: Free disk space
        id: disk
        if: inputs.mode == 'full' && steps.prepare.outputs.ready == 'true'
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Check palomar-standard-v1 runner capacity
        id: capacity
        if: inputs.mode == 'full' && steps.prepare.outputs.ready == 'true'
        run: >-
          python pipeline/scripts/verify_submission.py check-capacity
          --disk-path "$RUNNER_TEMP" --output "$RUNNER_TEMP/mechanical-report.json"

      - name: Install pinned elan
        id: elan
        if: inputs.mode == 'full' && steps.prepare.outputs.ready == 'true'
        run: |
          python3 pipeline/scripts/trusted_download.py \
            --url https://github.com/leanprover/elan/releases/download/v4.2.3/elan-x86_64-unknown-linux-gnu.tar.gz \
            --output "$RUNNER_TEMP/elan.tar.gz" \
            --sha256 df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2
          mkdir "$RUNNER_TEMP/elan"
          tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP/elan"
          "$RUNNER_TEMP/elan/elan-init" -y --no-modify-path --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: go
        if: inputs.mode == 'full' && steps.prepare.outputs.ready == 'true'
        with:
          go-version: "1.24.0"

      - name: Build pinned landrun
        id: landrun
        if: inputs.mode == 'full' && steps.prepare.outputs.ready == 'true'
        run: |
          CGO_ENABLED=0 go install github.com/zouuup/landrun/cmd/landrun@811cfff51ceaf3d9843708aa6d22e9b84ccac8b4
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build pinned Comparator
        id: comparator
        if: inputs.mode == 'full' && steps.prepare.outputs.ready == 'true'
        run: |
          python3 pipeline/scripts/trusted_git_fetch.py leanprover/comparator 575674928e239f5bc452aab72d1dd7b0f1326494 "$RUNNER_TEMP/comparator"
          cd "$RUNNER_TEMP/comparator"
          lake build comparator

      - name: Build pinned NanoDa kernel
        id: nanoda
        if: inputs.mode == 'full' && steps.prepare.outputs.ready == 'true'
        run: |
          python3 pipeline/scripts/trusted_git_fetch.py robsimmons/nanoda_lib 68d5ca9db226849b41a6fff59d796ff19d0a8840 "$RUNNER_TEMP/nanoda"
          cargo build --release --locked --manifest-path "$RUNNER_TEMP/nanoda/Cargo.toml"

      - name: Build toolchain-matched lean4export
        id: exporter
        if: inputs.mode == 'full' && steps.prepare.outputs.ready == 'true'
        env:
          LEAN4EXPORT_COMMIT: ${{ steps.prepare.outputs.lean4export_commit }}
          SUBMISSION_TOOLCHAIN: ${{ steps.prepare.outputs.lean_toolchain }}
        run: |
          python3 pipeline/scripts/trusted_git_fetch.py leanprover/lean4export "$LEAN4EXPORT_COMMIT" "$RUNNER_TEMP/lean4export"
          LEAN4EXPORT_TOOLCHAIN="$(tr -d '\r\n' < "$RUNNER_TEMP/lean4export/lean-toolchain")"
          python -c 'import sys; sys.path.insert(0, "pipeline"); from scripts.verify_submission import compatible_lean4export_toolchain; raise SystemExit(not compatible_lean4export_toolchain(sys.argv[1], sys.argv[2]))' \
            "$SUBMISSION_TOOLCHAIN" "$LEAN4EXPORT_TOOLCHAIN"
          cd "$RUNNER_TEMP/lean4export"
          ELAN_TOOLCHAIN="$SUBMISSION_TOOLCHAIN" lake build lean4export

      - name: Run Comparator and challenge provenance audit
        id: execute
        if: inputs.mode == 'full' && steps.prepare.outputs.ready == 'true'
        run: |
          python pipeline/scripts/verify_submission.py execute \
            --work-dir "$RUNNER_TEMP/palomar" \
            --output "$RUNNER_TEMP/mechanical-report.json" \
            --comparator "$RUNNER_TEMP/comparator/.lake/build/bin/comparator" \
            --lean4export "$RUNNER_TEMP/lean4export/.lake/build/bin/lean4export" \
            --landrun "$(go env GOPATH)/bin/landrun" \
            --nanoda "$RUNNER_TEMP/nanoda/target/release/nanoda_bin" \
            --comparator-commit 575674928e239f5bc452aab72d1dd7b0f1326494 \
            --landrun-commit 811cfff51ceaf3d9843708aa6d22e9b84ccac8b4 \
            --nanoda-commit 68d5ca9db226849b41a6fff59d796ff19d0a8840 \
            --execution-budget-seconds 19800 \
            --workflow-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Finalize interrupted mechanical report
        if: always()
        env:
          PALOMAR_INPUTS: ${{ toJSON(inputs) }}
          PALOMAR_STEPS: ${{ toJSON(steps) }}
          PALOMAR_WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 pipeline/scripts/workflow_report.py finalize --report "$RUNNER_TEMP/mechanical-report.json"

      - name: Upload bounded mechanical report
        id: upload1
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.mode == 'preflight' && 'preflight-report' || inputs.mode == 'correction' && 'correction-report' || 'mechanical-report' }}-${{ inputs.request_id }}
          path: ${{ runner.temp }}/mechanical-report.json
          if-no-files-found: error
          retention-days: 90

      - name: Wait before report upload retry 2
        if: always() && steps.upload1.outcome == 'failure'
        run: sleep 5

      - name: Retry bounded mechanical report upload 2
        id: upload2
        continue-on-error: true
        if: always() && steps.upload1.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.mode == 'preflight' && 'preflight-report' || inputs.mode == 'correction' && 'correction-report' || 'mechanical-report' }}-${{ inputs.request_id }}
          path: ${{ runner.temp }}/mechanical-report.json
          if-no-files-found: error
          retention-days: 90
          overwrite: true

      - name: Wait before report upload retry 3
        if: always() && steps.upload1.outcome == 'failure' && steps.upload2.outcome == 'failure'
        run: sleep 20

      - name: Retry bounded mechanical report upload 3
        id: upload3
        continue-on-error: true
        if: always() && steps.upload1.outcome == 'failure' && steps.upload2.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.mode == 'preflight' && 'preflight-report' || inputs.mode == 'correction' && 'correction-report' || 'mechanical-report' }}-${{ inputs.request_id }}
          path: ${{ runner.temp }}/mechanical-report.json
          if-no-files-found: error
          retention-days: 90
          overwrite: true

      - name: Fail the run when verification did not pass
        if: always()
        env:
          PALOMAR_INPUTS: ${{ toJSON(inputs) }}
          PALOMAR_STEPS: ${{ toJSON(steps) }}
        run: python3 pipeline/scripts/workflow_report.py gate --report "$RUNNER_TEMP/mechanical-report.json"
