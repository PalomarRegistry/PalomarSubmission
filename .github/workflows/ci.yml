name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.10"
      - name: Install locked lint dependency
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          --no-deps --only-binary=:all: -r requirements-lint.txt
      - name: Lint Python
        run: python -m ruff check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.10"
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.3.12"
          bundler-cache: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24.0"
      - name: Install verifier dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements.txt
      - name: Compile and test
        run: |
          python -m py_compile scripts/*.py tests/*.py
          PALOMAR_TEST_LICENSEE="$(command -v bundle)" python -m unittest discover -v
      - name: Match the current PalomarTemplate authoring contracts
        run: |
          curl --fail --location --retry 3 --retry-all-errors \
            --proto '=https' --tlsv1.2 \
            --output "$RUNNER_TEMP/palomar-template-formalization.yaml" \
            https://raw.githubusercontent.com/PalomarRegistry/PalomarTemplate/e5d6243c3b6e1bbce415647a7cb2d4354d2570a3/formalization.yaml
          cmp tests/fixtures/palomar-template-formalization.yaml \
            "$RUNNER_TEMP/palomar-template-formalization.yaml"
          curl --fail --location --retry 3 --retry-all-errors \
            --proto '=https' --tlsv1.2 \
            --output "$RUNNER_TEMP/palomar-template-comparator.json" \
            https://raw.githubusercontent.com/PalomarRegistry/PalomarTemplate/e5d6243c3b6e1bbce415647a7cb2d4354d2570a3/comparator.json
          cmp tests/fixtures/palomar-template-comparator.json \
            "$RUNNER_TEMP/palomar-template-comparator.json"
          python - "$RUNNER_TEMP/palomar-template-comparator.json" <<'PY'
          import pathlib
          import sys

          sys.path.insert(0, ".")
          from scripts.verify_submission import load_comparator_config

          load_comparator_config(pathlib.Path(sys.argv[1]))
          PY
      - name: Exercise the real Landrun and systemd boundary
        run: |
          CGO_ENABLED=0 go install github.com/zouuup/landrun/cmd/landrun@811cfff51ceaf3d9843708aa6d22e9b84ccac8b4
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$RUNNER_TEMP/elan.tar.gz" \
            https://github.com/leanprover/elan/releases/download/v4.2.3/elan-x86_64-unknown-linux-gnu.tar.gz
          echo "df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2  $RUNNER_TEMP/elan.tar.gz" \
            | sha256sum --check
          mkdir "$RUNNER_TEMP/elan"
          tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP/elan"
          "$RUNNER_TEMP/elan/elan-init" -y --no-modify-path --default-toolchain none
          "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.32.0
          PALOMAR_TEST_LANDRUN="$(go env GOPATH)/bin/landrun" \
          PALOMAR_TEST_LEAN="$(ELAN_TOOLCHAIN=leanprover/lean4:v4.32.0 "$HOME/.elan/bin/elan" which lean)" \
            python -m unittest tests.test_sandbox_integration -v
      - name: Validate configuration JSON
        run: |
          python -m json.tool toolchains.json >/dev/null
          python -c 'import sys; sys.path.insert(0, "."); from scripts.verify_submission import supported_toolchain; import json; m = json.load(open("toolchains.json"))["minimum"]; supported_toolchain(f"leanprover/lean4:{m}")' 
          python -m json.tool allowed-challenge-repositories.json >/dev/null
      - name: Check the repository paths the documentation names
        # `tests/test_report_issue.py` stayed in docs/launch-security-review.md
        # for a week after it was deleted, because nothing reads prose.
        #
        # A Markdown link target is a path. A backticked token is one when its
        # first segment is a real top-level entry, which is the test that
        # catches a deleted file under a directory that still exists. It does
        # not catch a deleted top-level file, because `formalization.yaml` and
        # `lakefile.toml` are things a submitter brings rather than things this
        # repository has, and a rule with false positives is one people learn
        # to suppress. To name a path that is deliberately gone, write it
        # without backticks.
        run: |
          python - <<'PY'
          import pathlib
          import re

          roots = {entry.name for entry in pathlib.Path(".").iterdir()}
          quoted = re.compile(r"`([^`\n]+)`")
          linked = re.compile(r"\]\(([^)\s]+)\)")
          pathish = re.compile(r"[A-Za-z0-9._][A-Za-z0-9._/-]*")
          documents = [pathlib.Path("SECURITY.md"), pathlib.Path("README.md")]
          documents += sorted(pathlib.Path("docs").rglob("*.md"))
          failed = False
          for document in documents:
              for number, line in enumerate(document.read_text().splitlines(), 1):
                  named = [match.group(1) for match in quoted.finditer(line)]
                  claimed = [
                      target.partition("#")[0]
                      for target in (match.group(1) for match in linked.finditer(line))
                      if "://" not in target and not target.startswith("#")
                  ]
                  for candidate in named + claimed:
                      if not candidate or not pathish.fullmatch(candidate):
                          continue
                      if candidate.split("/")[0] not in roots:
                          continue
                      if pathlib.Path(candidate).exists():
                          continue
                      print(f"{document}:{number}: names a path that does not exist: {candidate}")
                      failed = True
          raise SystemExit(failed)
          PY

      - name: Reject retired intake wording
        # The rule, the scan surface, and why prose and production scripts are
        # both in it are in the checker's own docstring. It is a checked-in
        # file rather than a heredoc so that the tests can run it against a
        # planted bad file, which is the only evidence that it still fails.
        run: python .github/scripts/check_retired_intake_wording.py

      - name: Reject mutable action selectors
        run: |
          python - <<'PY'
          import pathlib
          import re

          use = re.compile(r"^\s*uses:\s+(\S+?)(?:\s+#.*)?$")
          immutable = re.compile(r"^[^@]+@[0-9a-f]{40}$")
          failed = False
          for path in pathlib.Path(".github/workflows").glob("*.yml"):
              for number, line in enumerate(path.read_text().splitlines(), 1):
                  match = use.match(line)
                  if match and not match.group(1).startswith("./") and not immutable.fullmatch(match.group(1)):
                      print(f"{path}:{number}: action selector is not a full commit: {line.strip()}")
                      failed = True
          raise SystemExit(failed)
          PY
