name: Release conformance report

# Dispatch only. The per-PR cold build in compatibility.yml stays on one toolchain.
# This job writes the selected matrix. It does not install three Lean releases.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.10"
      - name: Write the pinned release report
        run: python3 scripts/release_matrix.py > "$RUNNER_TEMP/release-conformance.json"
