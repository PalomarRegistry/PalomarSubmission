name: Measure TauCeti trusted-root cache

# Measurement branch only; not for merge. Times the trusted-root stage of a TauCeti
# fixture with and without the Lake cache on the production default runner.
on:
  push:
    branches: [measure-tauceti-cache]

permissions:
  contents: read

jobs:
  measure:
    runs-on: [nscloud-ubuntu-24.04-amd64-16x32-with-features, "namespace-features:container.privileged=true"]
    timeout-minutes: 350
    steps:
      - name: Record verification deadline origin
        run: echo "PALOMAR_JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pipeline
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.18"
      - name: Install verifier dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes --no-deps -r pipeline/requirements.txt
      - name: Build pinned bubblewrap
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq meson ninja-build libcap-dev pkg-config >/dev/null
          echo "PALOMAR_BWRAP=$(pipeline/scripts/install_bwrap.sh "$RUNNER_TEMP/bwrap-bin")" >> "$GITHUB_ENV"
      - name: Install pinned Lean
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$RUNNER_TEMP/elan.tar.gz" \
            https://github.com/leanprover/elan/releases/download/v4.2.3/elan-x86_64-unknown-linux-gnu.tar.gz
          echo "df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2  $RUNNER_TEMP/elan.tar.gz" \
            | sha256sum --check
          mkdir "$RUNNER_TEMP/elan"
          tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP/elan"
          "$RUNNER_TEMP/elan/elan-init" -y --no-modify-path --default-toolchain none
          "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.36.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Prepare the TauCeti fixture
        run: |
          cp -R pipeline/tests/fixtures/tauceti-measure fixture
          git -C fixture init --quiet
          git -C fixture add --all
          git -C fixture -c user.name='Palomar measurement' -c user.email='measure@palomar.invalid' \
            commit --quiet -m 'Materialize measurement fixture'
      - name: Time the trusted-root stage
        env:
          ELAN_TOOLCHAIN: leanprover/lean4:v4.36.0
        run: |
          nproc; free -g
          python pipeline/scripts/measure_trusted_root_cache.py \
            --source fixture --bwrap "$PALOMAR_BWRAP" --output "$RUNNER_TEMP/measure.json" \
            2>&1 | tee "$RUNNER_TEMP/measure.log" | grep -v '^\s*$' | tail -200
          { echo '```json'; cat "$RUNNER_TEMP/measure.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the measurement
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: measure-tauceti-cache
          path: |
            ${{ runner.temp }}/measure.json
            ${{ runner.temp }}/measure.log
          if-no-files-found: warn
