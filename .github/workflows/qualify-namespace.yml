name: Qualify Namespace confinement
on:
  workflow_dispatch:
  push:
    branches: [namespace-qualification-20260917]
permissions:
  contents: read
jobs:
  qualify:
    # This probe never accepts candidate source and does not enable production.
    runs-on:
      - nscloud-ubuntu-24.04-amd64-16x32-with-features
      - namespace-features:container.privileged=true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.10"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.24.0"
      - name: Install trusted probe dependencies
        run: |
          python -m pip install --require-hashes --no-deps -r requirements.txt
          CGO_ENABLED=0 go install github.com/zouuup/landrun/cmd/landrun@811cfff51ceaf3d9843708aa6d22e9b84ccac8b4
          echo "PALOMAR_TEST_LANDRUN=$(go env GOPATH)/bin/landrun" >> "$GITHUB_ENV"
      - name: Record effective capacity
        run: python scripts/verification_profile.py --profile palomar-namespace-16x32-v1 --allow-disabled --disk-path "$RUNNER_TEMP"
      - name: Diagnose the runner systemd environment
        run: |
          ps -p 1 -o comm=
          cat /proc/self/cgroup
          findmnt --noheadings --output TARGET,FSTYPE,OPTIONS /sys/fs/cgroup || true
          systemctl is-system-running || true
          systemctl --user is-system-running || true
          python - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          from scripts import verify_submission as verifier

          original_run = subprocess.run

          def diagnostic_run(command, *args, **kwargs):
              result = original_run(command, *args, **kwargs)
              if any(Path(str(part)).name == "systemd-run" for part in command):
                  print("systemd probe return code:", result.returncode)
                  print("stdout:", (result.stdout or "")[-4000:])
                  print("stderr:", (result.stderr or "")[-4000:])
              return result

          subprocess.run = diagnostic_run
          try:
              verifier.systemd_command(
                  ["/usr/bin/true"], cwd=Path.cwd(), environment=dict(os.environ),
                  timeout=30, unrestricted_network=False,
                  resource_properties=verifier.permissive_resource_properties(),
              )
          except verifier.VerificationError as error:
              print("Required confinement unavailable:", error)
          PY
      - name: Require the existing resource and confinement boundaries
        run: |
          python -m unittest -v \
            tests.test_resource_supervision.RealResourceBoundaryTests \
            tests.test_sandbox_integration.SandboxIntegrationTests.test_real_read_write_process_and_network_boundary \
            tests.test_sandbox_integration.SandboxIntegrationTests.test_real_renderer_policy_proves_the_same_controls
