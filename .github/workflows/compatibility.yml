name: Namespace hard-timeout metadata probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on:
      - nscloud-ubuntu-24.04-amd64-16x32-with-features
      - namespace-features:container.privileged=true
    timeout-minutes: 1
    steps:
      - name: Deliberately exceed the job time limit
        run: sleep 120
      - name: Observe finalizer scheduling
        if: always()
        run: echo 'Finalizer ran after the timeout signal'
