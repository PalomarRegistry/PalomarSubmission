name: Namespace runner capacity probe
on:
  workflow_dispatch:
permissions: {}
jobs:
  capacity:
    name: Capacity ${{ matrix.shape }}
    strategy:
      fail-fast: false
      matrix:
        shape: [32x64, 64x128]
    runs-on:
      - nscloud-ubuntu-24.04-amd64-${{ matrix.shape }}-with-features
      - namespace-features:container.privileged=true
    timeout-minutes: 3
    env:
      EXPECTED_SHAPE: ${{ matrix.shape }}
    steps:
      - name: Verify provisioned machine capacity
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import json, os
          cpu, gib = map(int, os.environ['EXPECTED_SHAPE'].split('x'))
          effective = len(os.sched_getaffinity(0))
          memory = next(int(line.split()[1]) * 1024 for line in open('/proc/meminfo') if line.startswith('MemTotal:'))
          print(json.dumps({'requested_shape': os.environ['EXPECTED_SHAPE'], 'effective_cpus': effective, 'memory_bytes': memory}))
          assert effective >= cpu, 'Provisioned CPU capacity is below requested shape'
          assert memory >= (gib - 4) * 1024**3, 'Provisioned memory is below requested shape'
          PYTHON
