name: Cold-build compatibility

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Record verification deadline origin
        run: echo "PALOMAR_JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: pipeline
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.10"
      - name: Install verifier dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes --no-deps -r pipeline/requirements.txt
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.24.0"
      - name: Install pinned Landrun and Lean
        run: |
          CGO_ENABLED=0 go install github.com/zouuup/landrun/cmd/landrun@811cfff51ceaf3d9843708aa6d22e9b84ccac8b4
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$RUNNER_TEMP/elan.tar.gz" \
            https://github.com/leanprover/elan/releases/download/v4.2.3/elan-x86_64-unknown-linux-gnu.tar.gz
          echo "df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2  $RUNNER_TEMP/elan.tar.gz" \
            | sha256sum --check
          mkdir "$RUNNER_TEMP/elan"
          tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP/elan"
          "$RUNNER_TEMP/elan/elan-init" -y --no-modify-path --default-toolchain none
          "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.31.0-rc2
          "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.33.0-rc1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build pinned Comparator, lean4export, and NanoDa
        run: |
          git clone --filter=blob:none https://github.com/leanprover/comparator.git comparator
          git -C comparator checkout 68a064109f01c08f47c8edc9f51d6a2bbffaa188
          test "$(tr -d '\r\n' < comparator/lean-toolchain)" = "leanprover/lean4:v4.33.0-rc1"
          (cd comparator && lake build comparator)
          git clone --filter=blob:none https://github.com/leanprover/lean4export.git lean4export
          LEAN4EXPORT_COMMIT="$(python -c 'import sys; sys.path.insert(0, "pipeline"); from scripts.verify_submission import resolve_release_commit, supported_toolchain; print(resolve_release_commit("leanprover/lean4export", supported_toolchain("leanprover/lean4:v4.31.0-rc2")))')"
          git -C lean4export checkout "$LEAN4EXPORT_COMMIT"
          test "$(tr -d '\r\n' < lean4export/lean-toolchain)" = "leanprover/lean4:v4.31.0-rc2"
          (cd lean4export && lake build lean4export)
          git clone --filter=blob:none https://github.com/robsimmons/nanoda_lib.git nanoda
          git -C nanoda checkout 68d5ca9db226849b41a6fff59d796ff19d0a8840
          cargo build --release --locked --manifest-path nanoda/Cargo.toml
      - name: Clone the accepted compatibility fixture
        run: |
          git clone --filter=blob:none --no-checkout \
            https://github.com/kim-em/erdos-unit-distance-comparator.git fixture
          git -C fixture fetch --depth=1 origin 8d9b8319a4ed2dd094655978e905512dee6394b6
          git -C fixture checkout --detach 8d9b8319a4ed2dd094655978e905512dee6394b6
      - name: Exercise cold trusted and candidate builds
        env:
          ELAN_TOOLCHAIN: leanprover/lean4:v4.31.0-rc2
          PALOMAR_EXECUTION_BUDGET_SECONDS: "19800"
        run: |
          python pipeline/scripts/smoke_trusted_challenge.py \
            --source fixture \
            --landrun "$(go env GOPATH)/bin/landrun" \
            --comparator "$PWD/comparator/.lake/build/bin/comparator" \
            --lean4export "$PWD/lean4export/.lake/build/bin/lean4export" \
            --nanoda "$PWD/nanoda/target/release/nanoda_bin" \
            --adapter "$PWD/pipeline/scripts/landrun_passthrough.py" \
            --work-dir "$RUNNER_TEMP/palomar-compatibility"
