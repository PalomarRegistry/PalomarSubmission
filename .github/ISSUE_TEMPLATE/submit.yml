name: Submit a Lean-verified result
description: Ask Palomar to mechanically verify and review an immutable Lean project snapshot.
title: "[submission] "
labels:
  - submission
body:
  - type: markdown
    attributes:
      value: |
        Point Palomar at a **public GitHub repository** and an immutable
        40-character commit. CI reads the metadata and Comparator files from
        that snapshot. Please read the
        [submission policy](https://github.com/kim-em/PalomarPolicy/blob/main/CONTRIBUTING.md)
        first.

        The proof project may depend on arbitrary pinned repositories. Only the
        transitive imports of the configured Challenge source must come from Lean core,
        Mathlib/Tau Ceti, or projects already indexed in Palomar.

        The Lean project and Comparator files may live in subdirectories. Leave
        the path fields blank for the conventional repository-root layout.

        `formalization.yaml` must include one or two official arXiv subject
        classes and at least one MSC2020 code. Intake checks that the codes
        exist, and editorial review checks that they plausibly fit the result.

        The repository root must also contain exactly one conventional licence
        file whose standard SPDX licence matches `project.license`.

        Submit the substantive formalization only if you are one of its
        responsible authors or maintainers, or have their approval. If this
        repository is only a thin Comparator wrapper, that means the people
        responsible for the underlying formalization repository.

  - type: input
    id: repository_url
    attributes:
      label: Repository URL
      description: Public GitHub repository containing the Lean project and required Palomar files.
      placeholder: https://github.com/owner/formalization
    validations:
      required: true

  - type: input
    id: commit_sha
    attributes:
      label: Commit SHA
      description: Full 40-character Git commit to verify. Branches, tags, and abbreviated SHAs are not accepted.
      placeholder: "0000000000000000000000000000000000000000"
    validations:
      required: true

  - type: input
    id: project_path
    attributes:
      label: Project path (optional)
      description: Repository-relative Lean project directory. Leave blank when the Lakefile is at the repository root.
      placeholder: comparator
    validations:
      required: false

  - type: input
    id: comparator_config_path
    attributes:
      label: Comparator configuration path (optional)
      description: Repository-relative JSON path. Blank means comparator.json inside the selected project.
      placeholder: Audit/Headline/config.json
    validations:
      required: false

  - type: input
    id: formalization_metadata_path
    attributes:
      label: Formalization metadata path (optional)
      description: Repository-relative formalization.yaml path. Blank means formalization.yaml inside the selected project.
      placeholder: formalization.yaml
    validations:
      required: false

  - type: input
    id: existing_id
    attributes:
      label: Existing Palomar ID (updates only)
      description: Leave blank for a new result. To publish a new version, give the existing permanent identifier.
      placeholder: PALOMAR-2026-07-29-000123
    validations:
      required: false

  - type: dropdown
    id: authorization_relationship
    attributes:
      label: Relationship to the substantive formalization
      description: For a thin wrapper, answer about the underlying formalization repository.
      options:
        - I am a responsible author or maintainer
        - I have approval from a responsible author or maintainer
    validations:
      required: true

  - type: textarea
    id: authorization_evidence
    attributes:
      label: Authorization evidence (optional)
      description: Optional link or short note recording the approval. Do not include private correspondence without permission.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context (optional)
      description: Anything the reviewer should know that is not already in formalization.yaml.
    validations:
      required: false

  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Acknowledgements
      options:
        - label: I have read the [Palomar submission policy](https://github.com/kim-em/PalomarPolicy/blob/main/CONTRIBUTING.md) and the pinned commit contains every required project file at the paths given above.
          required: true
        - label: I have checked that the root licence file covers this repository and that cited works, reused formalizations, and dependencies may have separate licences.
          required: true
        - label: I understand that Palomar acceptance records Comparator verification and an automated editorial review, not journal peer review or human endorsement.
          required: true
        - label: I authorize Palomar to reproduce submitted metadata and review findings in its public database and website.
          required: true
