name: Verify
# Request id only: the Server finds the run by this title, and nothing here
# names the source repository or commit.
run-name: Verify ${{ inputs.request_id }}${{ inputs.execution_attempt && format(' [{0}]', inputs.execution_attempt) || '' }}

# PalomarConfidentialRuns' verify.yml is this file, kept canonically in
# PalomarSubmission's templates/confidential-callers/, with one
# PalomarSubmission commit substituted for both placeholders.
# PalomarConfidentialRuns' contract test requires the copy to be
# byte-for-byte that substitution, so change the template here, never the
# copy. The source is the server's
# tarball of the commit (source_url, source_sha256), never a checkout, and
# the run stops while the submission's tombstone_url answers anything but 404.
on:
  workflow_dispatch:
    inputs:
      repository:
        description: GitHub repository in owner/name form
        required: true
        type: string
      commit:
        description: Full 40-character commit to verify
        required: true
        type: string
      request_id:
        description: Opaque submission id from the submission server
        required: true
        type: string
      mode:
        description: Run shared preparation only, or the complete verifier
        required: false
        default: full
        type: choice
        options:
          - preflight
          - full
          - correction
      execution_profile:
        description: Approved operator-selected execution profile (blank selects the catalogue default)
        required: false
        default: ""
        type: string
      execution_attempt:
        description: Audited operator attempt identifier
        required: false
        type: string
      options:
        description: Submission settings JSON
        required: false
        type: string
      source_url:
        description: One-hour presigned URL of the source tarball from the submission server
        required: true
        type: string
      source_sha256:
        description: Expected SHA-256 of the source tarball
        required: true
        type: string
      tombstone_url:
        description: Presigned URL of the submission's withdrawal tombstone
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    permissions:
      contents: read
    # The uses pin fixes the workflow file; pipeline_commit fixes the scripts
    # it checks out and runs. They are the same commit.
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@<pipeline-commit>
    with:
      repository: ${{ inputs.repository }}
      commit: ${{ inputs.commit }}
      pipeline_commit: <pipeline-commit>
      request_id: ${{ inputs.request_id }}
      mode: ${{ inputs.mode }}
      execution_profile: ${{ inputs.execution_profile }}
      execution_attempt: ${{ inputs.execution_attempt }}
      options: ${{ inputs.options }}
      source_url: ${{ inputs.source_url }}
      source_sha256: ${{ inputs.source_sha256 }}
      tombstone_url: ${{ inputs.tombstone_url }}
