name: Verify
# Request id only: the Server finds the run by this title, and nothing here
# names the source repository or commit.
run-name: Verify ${{ inputs.request_id }}${{ inputs.execution_attempt && format(' [{0}]', inputs.execution_attempt) || '' }}

# PalomarConfidentialRuns' verify.yml is this file, kept canonically in
# PalomarSubmission's templates/confidential-callers/, with one
# PalomarSubmission commit substituted for every placeholder. The broker
# and the reviewer accept a run only if the caller is byte-for-byte that
# substitution, so change the template here, never the copy.
on:
  workflow_dispatch:
    inputs:
      repository:
        description: GitHub repository in owner/name form
        required: true
        type: string
      commit:
        description: Full 40-character commit to verify
        required: true
        type: string
      request_id:
        description: Opaque submission id from the submission server
        required: true
        type: string
      mode:
        description: Run shared preparation only, or the complete verifier
        required: false
        default: full
        type: choice
        options:
          - preflight
          - full
          - correction
      execution_profile:
        description: Approved operator-selected execution profile (blank selects the catalogue default)
        required: false
        default: ""
        type: string
      execution_attempt:
        description: Audited operator attempt identifier
        required: false
        type: string
      options:
        description: Submission settings JSON
        required: false
        type: string
      ticket:
        description: Single-use broker ticket for this dispatch
        required: true
        type: string

permissions:
  contents: read

jobs:
  # Credentialed jobs: GitHub-hosted, no submitted code. The broker checks
  # each one's OIDC identity, this file and the pin before it answers.
  snapshot:
    permissions:
      contents: read
      id-token: write
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/confidential-snapshot.yml@<pipeline-commit>
    with:
      ticket: ${{ inputs.ticket }}
      request_id: ${{ inputs.request_id }}
  validate:
    needs: snapshot
    permissions:
      contents: read
      id-token: write
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/confidential-validate.yml@<pipeline-commit>
    with:
      ticket: ${{ inputs.ticket }}
      request_id: ${{ inputs.request_id }}
  # Runs submitted code: no id-token, no credential, source from bundles only.
  verify:
    needs: validate
    permissions:
      contents: read
    # The uses pin fixes the workflow file; pipeline_commit fixes the scripts
    # it checks out and runs. They are the same commit.
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@<pipeline-commit>
    with:
      repository: ${{ inputs.repository }}
      commit: ${{ inputs.commit }}
      pipeline_commit: <pipeline-commit>
      request_id: ${{ inputs.request_id }}
      mode: ${{ inputs.mode }}
      # Always the confidential profile; the dispatched value is not used.
      execution_profile: palomar-confidential-16x32-v1
      execution_attempt: ${{ inputs.execution_attempt }}
      options: ${{ inputs.options }}
      source_bundle_artifact: ${{ needs.validate.outputs.source_bundle_artifact }}
      snapshot_sha256: ${{ needs.validate.outputs.snapshot_sha256 }}
